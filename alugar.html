<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="">
    <title>alugar</title>
</head>
<body>
    <section class="alugar-bikes" id="alugar-bikes">
        <span>formulário de reserva</span>
        <h2>Finalize seu aluguel</h2>

        <div class="card-aluguel">
            
        </div>

        <div class="dados-pessoais">
            <h3>dados pessoais</h3>

            <p>Nome completo *</p>
            <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva">

            <p>Telefone *</p>
            <input type="tel" name="telefone" id="telefone" placeholder="(11) 99999-0000">
        </div>

        <div class="endereco">
            <h3>endereço completo</h3>

            <p>CEP *</p>
            <input type="number" name="CEP" id="CEP" placeholder="0000-0000">

           <p>Logradouro *</p>
            <input type="text" name="logradouro" id="logradouro" placeholder="Rua, Avenida, etc.">

            <p>Número *</p>
            <input type="number" name="numero" id="numero" placeholder="123">

            <p>bairro *</p>
            <input type="text" name="bairro" id="bairro" placeholder="Nome do bairro">

            <p>Cidade *</p>
            <input type="text" name="saopaulo" id="saopaulo" placeholder="Rua, Avenida, etc.">

            <p>UF *</p>
            <input type="text" name="UF" id="UF" placeholder="SP">
        </div>

        <div class="emprestimo">
            <h3>período do empréstimo</h3>

            <p>Data de retirada *</p>
            <input type="date" name="data" id="data">

            <p>Horário de retirada *</p>
            <input type="time" name="horario-retirada" id="horario-retirada">

            <button class="reserva-bike">Confirmar reserva</button>
        </div>
    </section>
</body>
</html>
